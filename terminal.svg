    .k  { fill: #79c0ff; }
    .cover { fill: #0d1117; transform-box: fill-box; transform-origin: right center; }
    .out { opacity: 0; }

    @keyframes reveal { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .c1 { animation: reveal 0.9s steps(23) 0.5s forwards; }
    .o1 { animation: fade 0.3s ease 1.5s forwards; }

    .c2 { animation: reveal 1.2s steps(30) 2.2s forwards; }
    .a1 { animation: fade 0.3s ease 3.5s forwards; }
    .a2 { animation: fade 0.3s ease 3.7s forwards; }
    .a3 { animation: fade 0.3s ease 3.9s forwards; }
    .a4 { animation: fade 0.3s ease 4.1s forwards; }

    .c3 { animation: reveal 1.1s steps(27) 4.9s forwards; }
    .o3 { animation: fade 0.4s ease 6.2s forwards; }

    .c4 { animation: reveal 0.6s steps(17) 7.0s forwards; }
    .cursor { opacity: 0; animation: blink 1s steps(1) 7.7s infinite; }
  </style>

